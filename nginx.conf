server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Matches the backend's largest limit (MAX_IMAGE_UPLOAD_SIZE_BYTES, 512 MB for DICOM/NIfTI);
    # the backend enforces the per-modality limits itself.
    client_max_body_size 520m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # Stream large uploads to the backend instead of spooling them to nginx's disk.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed file names under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/anatomy-studio, /research/analytics, ...) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
