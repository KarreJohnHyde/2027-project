name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Core dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned audit tools
        run: python -m pip install uv==0.13.4 pip-audit==2.10.1
      - name: Audit the resolved deployment lock
        # The export contains every resolved core dependency. Optional workstation
        # research packages, ML native wheels and container OS packages need separate scans.
        run: |
          uv export --project backend --locked --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/deployment-requirements.txt" > /dev/null
          pip-audit --requirement "$RUNNER_TEMP/deployment-requirements.txt" --no-deps --disable-pip --format json --output "$RUNNER_TEMP/dependency-security.json"
      - name: Keep the advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-dependency-security
          path: ${{ runner.temp }}/dependency-security.json
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm and pnpm dependency locks
        # Figma Make uses pnpm; CI and the native launcher use npm. Both locks
        # must stay installable and free of reported advisories.
        run: |
          npm audit --package-lock-only --audit-level=low
          npx --yes pnpm@10.34.3 install --lockfile-only --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.34.3 audit --audit-level=low
          git diff --exit-code -- package.json package-lock.json pnpm-lock.yaml

      - name: Type-check, lint, and build
        run: npm run check

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-not-for-deployment
          DEV_SEED_ENABLED: "false"
        run: python -m pytest backend/tests scripts/tests/test_independent_reports.py -q

  browser:
    name: Browser regression
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/browser-qa/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Build the frontend (no anatomy assets)
        run: |
          npm ci
          npm run build:check

      - name: Install Playwright and Chromium
        working-directory: tools/browser-qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser regression suite
        working-directory: tools/browser-qa
        env:
          # The runner context is available to steps, not to job-level env.
          MEDTWIN_E2E_STATE: ${{ runner.temp }}/medtwin-e2e
        run: npx playwright test

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-report
          path: |
            ${{ runner.temp }}/medtwin-e2e/report
            ${{ runner.temp }}/medtwin-e2e/results
          retention-days: 7

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        env:
          SECRET_KEY: ci-only-secret-key-not-for-deployment
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.hardened.yml config --quiet

      - name: Build application images
        env:
          SECRET_KEY: ci-only-secret-key-not-for-deployment
          DEV_SEED_ENABLED: "false"
        run: docker compose build
